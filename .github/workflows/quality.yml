name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5.13', '8.5']
        dependencies: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.11.2
      - run: composer validate --strict
      - name: Prepare compatible development dependencies
        uses: ./.github/actions/development-dependencies
      - if: matrix.dependencies == 'highest'
        run: COMPOSER=.composer-development.json composer update --no-interaction --prefer-dist --no-progress
      - if: matrix.dependencies == 'lowest'
        run: COMPOSER=.composer-development.json composer update --no-interaction --prefer-dist --prefer-lowest --prefer-stable --no-progress
      - run: COMPOSER=.composer-development.json composer audit
      - run: composer check
      - if: matrix.php == '8.5' && matrix.dependencies == 'highest'
        run: composer bench
