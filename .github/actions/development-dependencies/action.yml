name: Development dependency revisions
description: Check out the actual latest compatible Componenta development sources
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: componenta/di
        ref: e203077d12048936f078d37d1cf3badd661e1716
        path: .development-dependencies/di
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: componenta/router
        ref: afe53a6b2d58cc235ef177eef6318e93d876350b
        path: .development-dependencies/router
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: componenta/middleware-factory
        ref: bba06a2a297a365d164f73fc5112eaeadbdaf746
        path: .development-dependencies/middleware-factory
        persist-credentials: false
    - name: Restore source branch identities and prepare Composer
      shell: bash
      run: |
        git -C .development-dependencies/di switch -C main
        git -C .development-dependencies/router switch -C fix/http-cache-dependency-integration-2026-11-26
        git -C .development-dependencies/middleware-factory switch -C refactor/middleware-factory-audit
        php .github/scripts/prepare-development.php
